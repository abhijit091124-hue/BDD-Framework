name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and BDD tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-bdd-framework

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-bdd-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare CI environment
        run: mkdir -p config && touch config/.env.qa

      - name: Typecheck
        run: npm run typecheck

      - name: Run BDD tests
        run: npm run test:bdd:html
        env:
          TEST_ENV: qa
          BASE_URL: https://www.saucedemo.com/
          APP_USERNAME: ${{ secrets.APP_USERNAME || 'standard_user' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD || 'secret_sauce' }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-artifacts
          path: |
            playwright-bdd-framework/reports/
            playwright-bdd-framework/screenshots/
          if-no-files-found: ignore