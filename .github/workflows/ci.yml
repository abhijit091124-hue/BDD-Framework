
name: BDDPlaywright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare QA configuration
        run: mkdir -p config && touch config/.env.qa

      - name: Typecheck
        run: npm run typecheck

      - name: Run BDD tests
        run: npm run test:all
        env:
          TEST_ENV: qa
          BASE_URL: https://www.saucedemo.com/
          APP_USERNAME: ${{ secrets.APP_USERNAME || 'standard_user' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD || 'secret_sauce' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bdd-test-results
          path: |
            allure-results/
            allure-report/
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14
